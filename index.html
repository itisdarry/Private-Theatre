<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Date with Radhe Ji ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0f;
            color: #ffffff;
        }
        .header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(to bottom, #1a1a24, #0b0b0f);
            border-bottom: 2px solid #ff1744;
        }
        .header h1 {
            font-size: 2.2rem;
            color: #ff1744;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .header p {
            color: #a5a5b0;
            font-size: 1.1rem;
            font-style: italic;
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .movie-card {
            background-color: #15151c;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(255, 23, 68, 0.1);
        }
        .movie-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            background-color: #ff1744;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        /* Naya Video Player Container CSS */
.video-container {
    width: 100%;
    aspect-ratio: 16 / 9; /* Modern aspect ratio */
    min-height: 250px; /* Drive player ko space dene ke liye */
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
}

.video-container iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* Mobile Screens ke liye */
@media (max-width: 600px) {
    .container {
        padding: 0 15px;
        margin: 20px auto;
    }
    
    .movie-card {
        padding: 15px; 
    }
    
    .header h1 {
        font-size: 1.8rem;
    }
    
    .movie-title {
        font-size: 1.2rem;
        flex-direction: column; 
        gap: 12px;
        text-align: center;
    }

    .video-container {
        min-height: 220px; /* Mobile par video height fix karega */
    }
}
        .message-box {
            margin-top: 30px;
            padding: 20px;
            background-color: rgba(255, 23, 68, 0.05);
            border-left: 4px solid #ff1744;
            border-radius: 5px;
        }
        .message-box h3 {
            margin-bottom: 10px;
            color: #04bcbc;
        }
        .message-box p {
            color: #fcfcfc;
            line-height: 1.6;
        }
        
    </style>
</head>
<body>

    <div class="header">
        <h1>Private Theater 🎬</h1>
        <p>A special movie night, just for you Radhe Ji ❤️</p>
    </div>

    <div class="container">
        <div class="movie-card">
            <div class="movie-title">
                <!-- Yahan apni Movie ka naam likho -->
                <span>Today's Special Movie</span> 
                <span class="badge">HD Stream</span>
            </div>

<div class="video-container">
  <iframe
    src="https://drive.google.com/file/d/1BJXY5LhLAulibJdAISkLc0Qf6brevhTj/preview"
    allow="autoplay; fullscreen"
    allowfullscreen>
  </iframe>
</div>
            
        </div>

        <div class="message-box">
            <h3>💌 A message for you</h3>
            <p>I hope you enjoy this movie! Popcorn le aana, aur aaram se dekhna. Tumhara Graphic Designer & Developer hamesha tumhare liye nayi cheezein banata rahega! Enjoy the show! ✨</p>
        </div>
    </div>

</body>
</html>
